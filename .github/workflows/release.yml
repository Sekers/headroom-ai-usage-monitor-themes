# Publishes the themes as release assets when a version tag is pushed, so the README's
# download links (releases/latest/download/...) save the files instead of opening them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish the themes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" themes/*.json --clobber
          else
            gh release create "$TAG" themes/*.json --verify-tag --title "$TAG" --generate-notes
          fi
