# Publishes the themes as release assets when a version tag is pushed, so the README's
# download links (releases/latest/download/...) save the files instead of opening them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the themes match build.py
        run: |
          python3 generator/build.py
          git diff --exit-code themes/
      - name: Publish the themes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" themes/*.json --clobber
          else
            gh release create "$TAG" themes/*.json --title "$TAG" --generate-notes
          fi
